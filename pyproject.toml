[project]
name = "gemini-mantle-agent"
version = "0.1.0"
description = "On-chain analyst agent on Google Cloud Agent Builder (ADK) + Gemini 2.5, wired to a Mantle MCP server. Walks chain queries and quotes block height, TVL, addresses, and tx hashes byte-for-byte."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Mukunda Katta" }]
requires-python = ">=3.10"
dependencies = [
    "google-adk>=1.0.0",
    "google-cloud-aiplatform[agent_engines]>=1.112.0",
    "mcp>=1.0.0",
    "streamlit>=1.40.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.urls]
Homepage = "https://github.com/MukundaKatta/gemini-mantle-agent"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gemini_mantle_agent = ["py.typed"]
